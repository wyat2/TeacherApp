steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/teacherapp:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/teacherapp:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/teacherapp:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/teacherapp:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'teacherapp'
      - '--image=gcr.io/$PROJECT_ID/teacherapp:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}'
      - '--set-env-vars=ConnectionStrings__PostgreSqlConnection=${_DB_CONNECTION_STRING}'
      - '--set-env-vars=ASPNETCORE_ENVIRONMENT=Production'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=fab-penguin'
      - '--set-env-vars=EmailSettings__SmtpPort=587'
      - '--set-env-vars=EmailSettings__SenderName=TeacherApp Support'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300'
    secretEnv:
      - EMAIL_PASSWORD
      - EMAIL_USERNAME  
      - EMAIL_SMTP_SERVER
  
  availableSecrets:
    secretManager:
      - versionName: projects/$PROJECT_ID/secrets/email-password/versions/latest
        env: EMAIL_PASSWORD
      - versionName: projects/$PROJECT_ID/secrets/email-username/versions/latest
        env: EMAIL_USERNAME
      - versionName: projects/$PROJECT_ID/secrets/email-smtp-server/versions/latest
        env: EMAIL_SMTP_SERVER

images:
  - 'gcr.io/$PROJECT_ID/teacherapp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/teacherapp:latest'

substitutions:
  _CLOUDSQL_INSTANCE: 'fab-penguin:us-central1:teacherapp-db'
  _DB_CONNECTION_STRING: 'Host=/cloudsql/fab-penguin:us-central1:teacherapp-db;Database=teacherapp;Username=teacherapp-user;Password=TeacherAppDB2026!Secure'

options:
  logging: CLOUD_LOGGING_ONLY
