version: '3.8'

services:
  teacherapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./teacherapp.db:/app/teacherapp.db
    restart: unless-stopped
